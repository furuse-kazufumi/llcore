[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmesh-llcore"
version = "0.1.0a0"
description = "Verified Neural Architecture Evolution on CPU — core algorithm evolution (state-update kernels, learning rules, factor-driven adaptive computation) under a sound contraction-certifier gate (closed-form / vertex / Lyapunov-SDP ladder; optional Z3/SMT invariant checks)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-COMMERCIAL", "NOTICE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Kazufumi Furuse", email = "kazufumi@furuse.work" }]
keywords = [
  "neural-architecture-evolution",
  "verified-ml",
  "contraction-verification",
  "sound-verifier",
  "state-space-model",
  "evolutionary-computation",
  "predictive-coding",
  "learning-rules",
  "z3",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
z3 = ["z3-solver>=4.13"]
# sdp: SDP/Lyapunov contraction certifier (research/spectral_lyapunov_contraction, Track D).
# Z3/SMT is decorative for closed-form contraction (Track A/B/C); the SDP common-Lyapunov
# certifier genuinely certifies more (Track D, +43% over closed-form 2-norm). Optional —
# the certifier degrades gracefully (reports unavailable) when cvxpy is absent.
sdp = ["cvxpy>=1.9"]
# chat: 実在小型 LLM (SmolLM2-Instruct, Apache-2.0) との基本会話レイヤ (llcore.chat)。
# CPU 完結 / on-prem。不在時は ChatDependencyError で fail-closed (黙って劣化しない)。
chat = ["torch>=2.2", "transformers>=4.46"]
# clip: text↔image 共有埋め込み (llcore.clip, default=SigLIP Apache-2.0)。連結性基盤。
clip = ["torch>=2.2", "transformers>=4.46", "pillow>=10"]
# text: text-only 検索用 encoder 差し替え (llcore.clip.text_encoders,
# default=all-MiniLM-L6-v2 Apache-2.0)。cross-modal は引き続き extra "clip" を使う。
text = ["sentence-transformers>=3"]
llive = ["llmesh-llive>=0.6"]
# rad は stdlib のみで動くため optional-dep 不要 (RAD コーパスを path-based 参照)
# LLCORE_RAD_DIR env で RAD 根ディレクトリを指定 (未設定時は graceful degrade = hint なし)
dev = [
  "pytest>=8",
  "pytest-cov>=4.1",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/furuse-kazufumi/llcore"
Repository = "https://github.com/furuse-kazufumi/llcore"

[tool.hatch.build.targets.wheel]
packages = ["src/llcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
