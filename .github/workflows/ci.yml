# CI gate — ruff lint, mypy --strict, and the unit test suite.
#
# Why this exists: `mypy src --strict` reached 0 errors across all 67 source files
# (session 2026-06-22). This workflow enforces that going forward so the strict-clean
# state cannot silently regress.
#
# mypy strict + warn_unused_ignores means the `# type: ignore[import-untyped]` markers
# (z3 / cvxpy / scipy) only match when those libs are installed-but-untyped. So the
# typecheck job installs the full optional dependency set to reproduce the developer's
# environment exactly — otherwise an absent lib turns `import-untyped` into
# `import-not-found` and the ignore becomes "unused" (a strict error).
name: ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff>=0.5"
      - name: ruff check (maintained trees; research/ is experimental, lint-exempt)
        run: ruff check src scripts tests ci

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install llcore + dev + optional deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # z3/sdp/chat bring the untyped libs whose type:ignore markers must match;
          # scipy/scikit-learn are imported by evolution/honest_eval and clip text encoders.
          pip install -e ".[dev,z3,sdp,chat,clip,text,ann]" scipy scikit-learn
      - name: mypy --strict (src + all of scripts/; must stay 0 errors)
        # 2026-06-22: scripts/ 全体が strict-clean になったため allowlist を廃し whole-dir 検査へ。
        # 新規スクリプトも strict を満たさないと CI が落ちる(より強いゲート)。
        # platform=win32(pyproject)で Linux CI でも Windows ターゲットとして型検査(ctypes.WinDLL 等)。
        run: mypy src scripts --strict

  # NOTE: 完全な unit suite(tests/unit, 1013 tests)は CI で走らせない。Windows 専用 API
  # (ctypes.WinDLL での RSS 計測テスト)と HuggingFace モデル DL を要するテスト(sentence-transformers
  # /clip/chat)が GitHub の Linux・オフライン runner に非可搬なため。これらは開発機(Windows, モデル
  # キャッシュ有)でローカル実行して担保する(`py -3.11 -m pytest tests/unit -q` = 1013 passed)。CI が
  # 強制するのは strict-clean(mypy)+ lint(ruff)= 回帰しやすい型/lint のゲート。
