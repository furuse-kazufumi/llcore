" y="46" width="14" height="4" fill="#7bd88f"/><text x="710" y="52" fill="#cfd6e4" font-size="12">cert_sdp (sound)</text>
  <text x="430.0" y="476" fill="#ff9f43" font-size="12" text-anchor="middle">無 gate / 経験 gate は実会話データ上で「安全に見える」変異を通し、真の ρ≥1 (発散性) へ漂流する</text>
  <text x="430.0" y="494" fill="#4ea1ff" font-size="12" text-anchor="middle">sound cert (cert_two / cert_sdp) は全採用変異に証明つき = 会話セッション記憶の摂動忘却 (再現性) を保証</text>
  <text x="430.0" y="511" fill="#566075" font-size="10" text-anchor="middle">honest: LLM は frozen (アダプタは sidecar、応答品質への主張なし) / ρ は from-below オラクル / 上方圧変異は開示済ストレス / ● = 変異採用, × = 棄却 (現 gene 維持)</text>
</svg>