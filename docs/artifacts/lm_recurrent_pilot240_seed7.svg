<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
<title id="title">LM memory at prompt length T</title>
<desc id="desc">GPT KV bytes rise linearly with prompt length while recurrent and RWKV stay constant.</desc>
<rect width="640" height="360" fill="#ffffff" />
<text x="64" y="16" font-family="Segoe UI, sans-serif" font-size="14" fill="#111827">Memory at prompt length T (bytes)</text>
<text x="64" y="356" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b7280">GPT beyond block_size is analytic projection only</text>
<line x1="64" y1="24" x2="64" y2="312" stroke="#111827" />
<line x1="64" y1="312" x2="620" y2="312" stroke="#111827" />
<text x="56" y="316.0" text-anchor="end">0</text><line x1="64" y1="312.0" x2="620" y2="312.0" stroke="#e5e7eb" /><text x="56" y="244.0" text-anchor="end">65536</text><line x1="64" y1="240.0" x2="620" y2="240.0" stroke="#e5e7eb" /><text x="56" y="172.0" text-anchor="end">131072</text><line x1="64" y1="168.0" x2="620" y2="168.0" stroke="#e5e7eb" /><text x="56" y="100.0" text-anchor="end">196608</text><line x1="64" y1="96.0" x2="620" y2="96.0" stroke="#e5e7eb" /><text x="56" y="28.0" text-anchor="end">262144</text><line x1="64" y1="24.0" x2="620" y2="24.0" stroke="#e5e7eb" />
<text x="64.0" y="340" text-anchor="middle">1</text><text x="96.7" y="340" text-anchor="middle">16</text><text x="201.4" y="340" text-anchor="middle">64</text><text x="620.0" y="340" text-anchor="middle">256</text>
<polyline fill="none" stroke="#2563eb" stroke-width="3" points="64.0,310.9 96.7,294.0 201.4,240.0" />
<polyline fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" points="201.4,240.0 620.0,24.0" />
<polyline fill="none" stroke="#059669" stroke-width="3" points="64.0,311.4 96.7,311.4 201.4,311.4 620.0,311.4" />
<polyline fill="none" stroke="#dc2626" stroke-width="3" points="64.0,309.2 96.7,309.2 201.4,309.2 620.0,309.2" />
<text x="500" y="26" font-family="Segoe UI, sans-serif" font-size="12" fill="#2563eb">GPT KV (measured)</text>
<text x="500" y="44" font-family="Segoe UI, sans-serif" font-size="12" fill="#2563eb">GPT KV (projection)</text>
<text x="500" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#059669">Recurrent state</text>
<text x="500" y="80" font-family="Segoe UI, sans-serif" font-size="12" fill="#dc2626">RWKV state</text>
</svg>
